name: Build Windows App

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build unified application
        run: pyinstaller build.spec

      - name: Verify packaged layout
        shell: pwsh
        run: |
          $RequiredFiles = @(
            "dist/CapsWriter-Offline/CapsWriter.exe",
            "dist/CapsWriter-Offline/config_client.py",
            "dist/CapsWriter-Offline/config_server.py",
            "dist/CapsWriter-Offline/core/app_runtime.py",
            "dist/CapsWriter-Offline/core/client/app.py",
            "dist/CapsWriter-Offline/core/server/app.py",
            "dist/CapsWriter-Offline/models/请将模型文件放在此目录.txt",
            "dist/CapsWriter-Offline/internal/_sounddevice_data/portaudio-binaries/libportaudio64bit.dll"
          )
          foreach ($File in $RequiredFiles) {
            if (-not (Test-Path $File)) {
              throw "Missing packaged file: $File"
            }
          }

      - name: Zip build
        shell: pwsh
        run: |
          $VersionName = if ("${{ github.event_name }}" -eq "pull_request") {
            "pr-${{ github.event.pull_request.number }}"
          } else {
            "${{ github.ref_name }}"
          }
          $ZipName = "CapsWriter-Offline-Windows-$VersionName.zip"
          Compress-Archive `
            -Path dist/CapsWriter-Offline/* `
            -DestinationPath "dist/$ZipName"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapsWriter-Offline-Windows-${{ github.run_number }}
          path: dist/*.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
